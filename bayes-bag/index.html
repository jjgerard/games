<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bag of Shapes</title><link rel="stylesheet" href="../shared/style.css">
<style>
#tray{display:flex;flex-wrap:wrap;gap:4px;min-height:28px}
#tray span{width:20px;height:20px;display:inline-block}
.c{background:var(--a);border-radius:50%}.s{background:var(--b)}
canvas{width:100%;height:220px;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
input[type=range]{flex:1;min-width:140px}
</style></head><body><main>
<a href="../">← all games</a>
<h1>Bag of Shapes</h1>
<p class="muted">A bag holds circles <span class="c" style="display:inline-block;width:12px;height:12px"></span> and squares <span class="s" style="display:inline-block;width:12px;height:12px"></span>. What fraction are circles? Draw (with replacement), then bet on an interval. Narrow and correct pays; each draw costs 2 points.</p>
<div class="card"><b>Round <span id="rd">1</span>/5</b> · Score <b id="score">0</b>
<p id="priorTxt" class="muted"></p></div>
<div class="card">
<div class="row"><button id="d1">Draw 1</button><button id="d5">Draw 5</button><span id="counts" class="muted"></span></div>
<div id="tray"></div></div>
<div class="card"><canvas id="cv" width="700" height="220"></canvas>
<label><input type="checkbox" id="show"> Show Bayesian posterior (prior × evidence)</label></div>
<div class="card"><b>Your 90%-style bet on the circle fraction</b>
<div class="row">Low <input type="range" id="lo" min="0" max="100" value="20"><b id="loV"></b></div>
<div class="row">High <input type="range" id="hi" min="0" max="100" value="80"><b id="hiV"></b></div>
<button class="primary" id="lock">Lock in</button> <button id="next" disabled>Next round</button>
<p id="msg"></p></div>
</main>
<script>
const $=id=>document.getElementById(id);
function lgamma(x){const g=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const c of g)s+=c/++y;return -t+Math.log(2.5066282746310005*s/x)}
const bpdf=(x,a,b)=>x<=0||x>=1?0:Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+(a-1)*Math.log(x)+(b-1)*Math.log(1-x));
const N=400,grid=[...Array(N)].map((_,i)=>(i+.5)/N);
function interval(a,b,mass=.9){const p=grid.map(x=>bpdf(x,a,b)),T=p.reduce((s,v)=>s+v,0);let c=0,lo=0,hi=1;
 for(let i=0;i<N;i++){c+=p[i]/T;if(c>=(1-mass)/2&&lo===0){lo=grid[i]}if(c>=1-(1-mass)/2){hi=grid[i];break}}return[lo,hi]}
function betaSample(a,b){const g=k=>{let s=0;for(let i=0;i<k;i++)s-=Math.log(Math.random());return s};
 // integer shapes only (priors used are integer): gamma via sum of exponentials
 const x=g(a),y=g(b);return x/(x+y)}
const PRIORS=[[1,1,"No idea how this bag was filled: any mix is equally likely."],[1,1,"Still no clue."],
 [6,2,"The factory usually makes circle-heavy bags (prior ≈ Beta(6,2))."],[2,6,"This factory usually makes square-heavy bags (prior ≈ Beta(2,6))."],[1,1,"Anything goes again."]];
let round=0,score=0,p,a0,b0,k,n,locked;
function start(){[a0,b0]=PRIORS[round];p=betaSample(a0,b0);k=n=0;locked=false;
 $("rd").textContent=round+1;$("priorTxt").textContent=PRIORS[round][2];$("tray").innerHTML="";
 $("msg").textContent="";$("next").disabled=true;$("lock").disabled=false;$("d1").disabled=$("d5").disabled=false;draw()}
function pull(m){if(locked)return;for(let i=0;i<m;i++){const c=Math.random()<p;n++;k+=c;const e=document.createElement("span");e.className=c?"c":"s";$("tray").append(e)}draw()}
function draw(){$("counts").textContent=`${k} circles, ${n-k} squares`;$("loV").textContent=$("lo").value+"%";$("hiV").textContent=$("hi").value+"%";
 const cv=$("cv"),g=cv.getContext("2d"),W=cv.width,H=cv.height,css=getComputedStyle(document.body);g.clearRect(0,0,W,H);
 const a=a0+k,b=b0+n-k,pr=grid.map(x=>bpdf(x,a0,b0)),po=grid.map(x=>bpdf(x,a,b));
 const mx=Math.max(...po,...pr,1),X=x=>x*W,Y=v=>H-20-(v/mx)*(H-40);
 g.fillStyle=css.color;g.font="12px system-ui";for(let t=0;t<=10;t+=2){g.fillText(t*10+"%",X(t/10)-8,H-4)}
 const line=(arr,col,w)=>{g.beginPath();arr.forEach((v,i)=>i?g.lineTo(X(grid[i]),Y(v)):g.moveTo(X(grid[i]),Y(v)));g.strokeStyle=col;g.lineWidth=w;g.stroke()};
 g.globalAlpha=.4;line(pr,"#999",2);g.globalAlpha=1;
 g.fillStyle="rgba(46,134,171,.2)";g.fillRect(X($("lo").value/100),0,X(($("hi").value-$("lo").value)/100),H-20);
 if($("show").checked||locked){const[l,h]=interval(a,b);g.beginPath();g.moveTo(X(l),H-20);grid.forEach((x,i)=>{if(x>=l&&x<=h)g.lineTo(X(x),Y(po[i]))});g.lineTo(X(h),H-20);g.fillStyle="rgba(228,87,46,.25)";g.fill();line(po,"#e4572e",2.5)}
 if(locked){g.strokeStyle="#2e9e6b";g.lineWidth=3;g.beginPath();g.moveTo(X(p),0);g.lineTo(X(p),H-20);g.stroke()}}
function lock(){const lo=+$("lo").value/100,hi=+$("hi").value/100;if(hi<=lo){$("msg").textContent="High must exceed low.";return}
 locked=true;const hit=p>=lo&&p<=hi,pts=Math.round((hit?100*(1-(hi-lo)):0)-2*n);score+=pts;$("score").textContent=score;
 const[l,h]=interval(a0+k,b0+n-k);
 $("msg").innerHTML=`True circle fraction: <b>${(p*100).toFixed(1)}%</b>. Your bet ${hit?"✅ caught it":"❌ missed"} → <b>${pts}</b> pts.<br>Bayes' 90% credible interval: ${(l*100).toFixed(0)}–${(h*100).toFixed(0)}%. Prior pseudo-counts ${a0-1}/${b0-1} + data ${k}/${n-k}.`;
 $("lock").disabled=$("d1").disabled=$("d5").disabled=true;$("next").disabled=false;
 if(round===4){$("next").textContent="Play again";}draw()}
$("d1").onclick=()=>pull(1);$("d5").onclick=()=>pull(5);$("lock").onclick=lock;
$("lo").oninput=$("hi").oninput=$("show").onchange=draw;
$("next").onclick=()=>{if(round===4){round=0;score=0;$("score").textContent=0;$("next").textContent="Next round"}else round++;start()};
start();
</script></body></html>
